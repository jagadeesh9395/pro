<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="notification-bell" class="notification-container">
        <div class="dropdown">
            <button class="btn btn-link position-relative" type="button" id="notificationDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-bell-fill fs-5"></i>
                <span id="notification-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
                    0
                    <span class="visually-hidden">unread messages</span>
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end p-0" aria-labelledby="notificationDropdown" style="width: 350px; max-height: 400px; overflow-y: auto;">
                <li class="p-2 border-bottom bg-light d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Notifications</span>
                    <small class="text-muted" id="mark-all-read" style="cursor: pointer;">Mark all read</small>
                </li>
                <div id="notification-list">
                    <!-- Notifications will be loaded here -->
                    <li class="p-3 text-center text-muted">No notifications</li>
                </div>
            </ul>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                loadUnreadCount();
                loadNotifications();
                connectWebSocket();

                // Poll for unread count every minute
                setInterval(loadUnreadCount, 60000);
            });

            function loadUnreadCount() {
                fetch('/api/notifications/unread-count')
                    .then(response => response.json())
                    .then(data => {
                        const badge = document.getElementById('notification-badge');
                        if (data.count > 0) {
                            badge.innerText = data.count;
                            badge.style.display = 'block';
                        } else {
                            badge.style.display = 'none';
                        }
                    });
            }

            function loadNotifications() {
                fetch('/api/notifications?size=5')
                    .then(response => response.json())
                    .then(data => {
                        const list = document.getElementById('notification-list');
                        list.innerHTML = '';
                        
                        if (data.content && data.content.length > 0) {
                            data.content.forEach(notification => {
                                const item = document.createElement('li');
                                item.className = `dropdown-item p-2 border-bottom ${notification.read ? '' : 'bg-light'}`;
                                item.innerHTML = `
                                    <div class="d-flex justify-content-between">
                                        <strong class="small">${notification.title}</strong>
                                        <small class="text-muted" style="font-size: 0.7rem;">${new Date(notification.createdAt).toLocaleDateString()}</small>
                                    </div>
                                    <p class="mb-1 small text-truncate" style="max-width: 300px;">${notification.message}</p>
                                `;
                                item.onclick = (e) => {
                                    e.stopPropagation(); // Prevent dropdown from closing immediately
                                    markAsRead(notification.id);
                                    // Navigate if needed, e.g., to application details
                                };
                                list.appendChild(item);
                            });
                        } else {
                            list.innerHTML = '<li class="p-3 text-center text-muted">No notifications</li>';
                        }
                    });
            }

            function markAsRead(id) {
                fetch(`/api/notifications/${id}/read`, { method: 'POST' })
                    .then(() => {
                        loadUnreadCount();
                        loadNotifications();
                    });
            }

            function connectWebSocket() {
                const socket = new SockJS('/ws');
                const stompClient = Stomp.over(socket);
                stompClient.debug = null; // Disable debug logs

                stompClient.connect({}, function(frame) {
                    // Subscribe to user-specific notifications
                    stompClient.subscribe('/user/queue/notifications', function(notification) {
                        loadUnreadCount();
                        loadNotifications();
                        
                        // Optional: Show toast
                        const body = JSON.parse(notification.body);
                        // showToast(body.title, body.message);
                    });
                });
            }
        </script>
        <style>
            .notification-container .dropdown-menu {
                box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
                border: none;
                border-radius: 16px;
                overflow: hidden;
            }
            .notification-container .dropdown-item {
                transition: background 0.2s;
            }
            .notification-container .dropdown-item:hover {
                background-color: #f8f9fa;
                cursor: pointer;
            }
            /* Scrollbar styling */
            .notification-container .dropdown-menu::-webkit-scrollbar {
                width: 6px;
            }
            .notification-container .dropdown-menu::-webkit-scrollbar-track {
                background: #f1f1f1;
            }
            .notification-container .dropdown-menu::-webkit-scrollbar-thumb {
                background: #ccc;
                border-radius: 3px;
            }
        </style>
    </div>
</body>
</html>
