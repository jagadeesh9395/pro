# Application Configuration
spring.application.name=talent-trove
server.port=8080
server.servlet.context-path=/

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=talent_trove
spring.data.mongodb.auto-index-creation=true

# Enable MongoDB logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.mongodb.driver=INFO

# Disable auto-index creation on startup (can be enabled in production)
# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.tal.pro=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# WebSocket Configuration
spring.websocket.allowed-origins=*

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=application-status-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tal.pro.event

# Kafka Topic Names
kafka.topic.application-status=application-status

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.retries=3
spring.kafka.producer.acks=1
# Exclude Kafka auto-configuration
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
# WebSocket Message Broker
spring.websocket.stomp.broker-relay.enabled=false
spring.websocket.stomp.broker-relay.host=localhost
spring.websocket.stomp.broker-relay.port=61613
spring.websocket.stomp.broker-relay.system-login=guest
spring.websocket.stomp.broker-relay.system-passcode=guest
spring.websocket.stomp.broker-relay.client-login=guest
spring.websocket.stomp.broker-relay.client-passcode=guest

# WebSocket Session
server.servlet.session.timeout=30m
spring.session.timeout=30m
