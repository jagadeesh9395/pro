<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Resume - SmartAiResume</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/smart-resume.css}" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      .divider {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        color: var(--text-secondary);
        font-weight: 600;
      }
      .divider::before,
      .divider::after {
        content: "";
        width: 1px;
        height: 40px;
        background: var(--border);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <a href="/" class="logo">SmartAiResume</a>
        <div class="flex gap-4">
          <a href="#" class="btn btn-outline">My Resumes</a>
        </div>
      </header>

      <main>
        <div class="text-center" style="margin-bottom: 4rem">
          <h1>
            Upload your
            <span style="border-bottom: 4px solid var(--accent)">resume</span>
          </h1>
        </div>

        <div class="card">
          <form
            id="uploadForm"
            th:action="@{/resume-builder/upload}"
            method="post"
            enctype="multipart/form-data"
          >
            <div class="upload-container">
              <div
                class="drag-drop-zone"
                id="dropZone"
                onclick="document.getElementById('fileInput').click()"
              >
                <div class="upload-icon-wrapper">
                  <div class="icon-placeholder">
                    <i
                      class="bi bi-file-earmark-arrow-up"
                      style="font-size: 2rem"
                    ></i>
                  </div>
                </div>
                <h3 style="margin-bottom: 0.5rem">
                  Drag & drop your file here
                </h3>
                <div
                  class="btn btn-primary"
                  style="
                    background-color: #ffc85e;
                    color: #111;
                    border: none;
                    font-weight: 700;
                  "
                >
                  <i class="bi bi-upload"></i> Browse your computer
                </div>
                <p
                  style="
                    margin-top: 1.5rem;
                    color: var(--text-secondary);
                    font-size: 0.875rem;
                  "
                >
                  Acceptable file types: DOC, DOCX, PDF, HTML, RTF, TXT
                </p>
                <input
                  type="file"
                  id="fileInput"
                  name="file"
                  style="display: none"
                  onchange="handleFileSelect(this)"
                />
              </div>

              <div class="divider">OR</div>

              <div
                style="
                  flex: 1;
                  display: flex;
                  flex-direction: column;
                  gap: 1rem;
                "
              >
                <button
                  type="button"
                  class="btn btn-outline"
                  style="justify-content: center; padding: 1rem"
                >
                  <img
                    src="https://upload.wikimedia.org/wikipedia/commons/7/78/Dropbox_Icon.svg"
                    width="20"
                    alt="Dropbox"
                  />
                  Dropbox
                </button>
                <button
                  type="button"
                  class="btn btn-outline"
                  style="justify-content: center; padding: 1rem"
                >
                  <img
                    src="https://upload.wikimedia.org/wikipedia/commons/d/da/Google_Drive_logo.png"
                    width="20"
                    alt="Drive"
                  />
                  Google Drive
                </button>
              </div>
            </div>

            <div
              id="fileInfo"
              style="
                display: none;
                margin-top: 2rem;
                padding: 1rem;
                background: #f3f4f6;
                border-radius: 12px;
                align-items: center;
                justify-content: space-between;
              "
            >
              <div class="flex items-center gap-4">
                <i
                  class="bi bi-file-earmark-text"
                  style="font-size: 1.5rem; color: var(--primary)"
                ></i>
                <div>
                  <div id="fileName" style="font-weight: 600">resume.pdf</div>
                  <div
                    id="fileSize"
                    style="font-size: 0.85rem; color: var(--text-secondary)"
                  >
                    1.2 MB
                  </div>
                </div>
              </div>
              <button
                type="button"
                class="btn btn-outline"
                onclick="resetFile()"
                style="padding: 0.5rem"
              >
                Cancel
              </button>
            </div>

            <div class="flex justify-between items-center mt-8">
              <a
                href="#"
                style="
                  color: var(--primary);
                  font-weight: 700;
                  text-decoration: none;
                "
                >Create a new resume</a
              >
              <button
                type="submit"
                id="uploadBtn"
                class="btn btn-primary"
                style="
                  padding: 1rem 3rem;
                  background-color: #e5e7eb;
                  color: #9ca3af;
                  cursor: not-allowed;
                "
                disabled
              >
                Upload
              </button>
            </div>
          </form>
        </div>

        <p
          class="text-center mt-8"
          style="font-size: 0.75rem; color: var(--text-secondary)"
        >
          By clicking any of the actions listed here, you agree to our
          <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.
        </p>
      </main>
    </div>

    <script>
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const fileInfo = document.getElementById("fileInfo");
      const fileName = document.getElementById("fileName");
      const fileSize = document.getElementById("fileSize");
      const uploadBtn = document.getElementById("uploadBtn");

      function handleFileSelect(input) {
        if (input.files && input.files[0]) {
          const file = input.files[0];
          showFileInfo(file);
        }
      }

      function showFileInfo(file) {
        fileName.textContent = file.name;
        fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + " MB";
        fileInfo.style.display = "flex";

        uploadBtn.disabled = false;
        uploadBtn.style.backgroundColor = "var(--primary)";
        uploadBtn.style.color = "white";
        uploadBtn.style.cursor = "pointer";
      }

      function resetFile() {
        fileInput.value = "";
        fileInfo.style.display = "none";
        uploadBtn.disabled = true;
        uploadBtn.style.backgroundColor = "#E5E7EB";
        uploadBtn.style.color = "#9CA3AF";
        uploadBtn.style.cursor = "not-allowed";
      }

      // Drag and drop handlers
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "var(--primary)";
        dropZone.style.background = "#EEF2FF";
      });

      dropZone.addEventListener("dragleave", () => {
        dropZone.style.borderColor = "var(--border)";
        dropZone.style.background = "var(--bg-secondary)";
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          fileInput.files = files;
          showFileInfo(files[0]);
        }
      });
    </script>
  </body>
</html>
