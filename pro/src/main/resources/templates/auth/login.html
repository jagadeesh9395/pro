<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TalentTrove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .form-control:focus {
            border-color: #4a6fa5;
            box-shadow: 0 0 0 0.25rem rgba(74, 111, 165, 0.25);
        }
        .btn-primary {
            background-color: #4a6fa5;
            border-color: #4a6fa5;
        }
        .btn-primary:hover {
            background-color: #3a5a8c;
            border-color: #3a5a8c;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo i {
            font-size: 3rem;
            color: #4a6fa5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="logo">
                <i class="bi bi-people-fill"></i>
                <h2 class="mt-2">TalentTrove</h2>
                <p class="text-muted">Sign in to your account</p>
            </div>
            
            <!-- Success Message -->
            <!-- Error Message -->
            <div id="errorAlert" class="alert alert-danger alert-dismissible fade" role="alert">
                <span id="errorMessage">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <form id="loginForm" th:action="@{/auth/login}" method="post">
                <!-- CSRF Token -->
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
                
                <!-- Error Message -->
                <div th:if="${param.error}" class="alert alert-danger">
                    <span th:if="${param.error}" th:text="'Invalid username or password.'"></span>
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    You have been logged out successfully.
                </div>
                
                <div class="mb-3">
                    <label for="username" class="form-label">Username <small class="text-muted">(Use 'candidate1' for demo)</small></label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <div class="form-text">
                        <a th:href="@{/auth/forgot-password}">Forgot password?</a>
                    </div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                    <label class="form-check-label" for="remember-me">Remember me</label>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>
            </form>
            
            <div class="text-center mt-3">
                <p class="mb-0">Don't have an account? <a th:href="@{/auth/register}">Register</a></p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const form = e.target;
            const formData = new FormData(form);
            console.log('Form data:', Object.fromEntries(formData.entries()));
            
            // You can uncomment this to see the raw form data being sent
            // e.preventDefault();
            // fetch(form.action, {
            //     method: 'POST',
            //     body: formData,
            //     headers: {
            //         'X-Requested-With': 'XMLHttpRequest'
            //     }
            // })
            // .then(response => {
            //     console.log('Response status:', response.status);
            //     return response.text();
            // })
            // .then(text => console.log('Response text:', text))
            // .catch(error => console.error('Error:', error));
        });
    </script>
    <script>
        // Show error message if any
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error')) {
                const errorAlert = document.getElementById('errorAlert');
                const errorMessage = document.getElementById('errorMessage');
                
                errorMessage.textContent = 'Invalid username or password';
                errorAlert.classList.remove('fade');
                errorAlert.classList.add('show');
                
                // Hide after 5 seconds
                setTimeout(() => {
                    errorAlert.classList.remove('show');
                    errorAlert.classList.add('fade');
                }, 5000);
            }
        });
    </script>
</body>
</html>
