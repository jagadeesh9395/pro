<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="notification-bell" class="notification-container">
        <div class="dropdown">
            <button class="btn btn-link position-relative" type="button" id="notificationDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-bell-fill fs-5"></i>
                <span id="notification-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none;">
                    0
                    <span class="visually-hidden">unread messages</span>
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end p-0" aria-labelledby="notificationDropdown" style="width: 350px; max-height: 400px; overflow-y: auto;">
                <li class="p-2 border-bottom bg-light d-flex justify-content-between align-items-center">
                    <span class="fw-bold">Notifications</span>
                    <div>
                        <small class="text-muted me-2" id="mark-all-read" style="cursor: pointer;">Mark all read</small>
                        <small class="text-muted" id="refresh-notifications" style="cursor: pointer;">
                            <i class="bi bi-arrow-clockwise"></i>
                        </small>
                    </div>
                </li>
                <div id="notification-list">
                    <li class="p-3 text-center text-muted">Loading notifications...</li>
                </div>
            </ul>
        </div>
        <style>
            .notification-container .dropdown-menu {
                box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
                border: none;
                border-radius: 16px;
                overflow: hidden;
            }
            .notification-container .dropdown-item {
                transition: background 0.2s;
            }
            .notification-container .dropdown-item:hover {
                background-color: #f8f9fa;
                cursor: pointer;
            }
            /* Scrollbar styling */
            .notification-container .dropdown-menu::-webkit-scrollbar {
                width: 6px;
            }
            .notification-container .dropdown-menu::-webkit-scrollbar-track {
                background: #f1f1f1;
            }
            .notification-container .dropdown-menu::-webkit-scrollbar-thumb {
                background: #ccc;
                border-radius: 3px;
            }
        </style>
    </div>
</body>
</html>
