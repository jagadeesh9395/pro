<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Jobs - TalentTrove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            /* Primary Colors */
            --primary-dark-blue: #1F468C;
            --primary-blue: #3765A7;
            --primary-teal: #00A78F;
            
            /* UI Colors */
            --bg-light: #f8fafc;
            --border-color: #e5e7eb;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
        }
        
        body {
            background-color: var(--bg-light);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        .sidebar {
            min-height: 100vh;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 250px;
            padding: 20px 0;
            z-index: 100;
        }
        
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
        
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            background: white;
            overflow: hidden;
        }
        
        .nav-link {
            color: var(--text-primary);
            padding: 10px 20px;
            margin: 2px 15px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .nav-link:hover, .nav-link.active {
            background: linear-gradient(to right, var(--primary-blue), var(--primary-teal));
            color: white !important;
        }
        
        .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .status-active {
            background-color: #def7ec;
            color: #03543f;
        }
        
        .status-closed {
            background-color: #fde8e8;
            color: #9b1c1c;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="logo text-center py-3 mb-4 border-bottom">
        <img src="/images/TalentTrove.jpeg" alt="TalentTrove" style="max-width: 180px; height: auto;">
    </div>

    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/recruiter/dashboard}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" th:href="@{/recruiter/jobs}">
                <i class="bi bi-briefcase"></i> Jobs
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/recruiter/candidates}">
                <i class="bi bi-people"></i> Candidates
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/recruiter/upcoming-interviews}">
                <i class="bi bi-calendar-check"></i> Interviews
            </a>
        </li>
        <li class="nav-item mt-4">
            <a class="nav-link text-danger" th:href="@{/auth/logout}">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1">My Jobs</h4>
            <p class="text-muted mb-0">Manage your job postings and applications</p>
        </div>
        <a th:href="@{/recruiter/jobs/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-2"></i>Post New Job
        </a>
    </div>

    <!-- Job List -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Job Title</th>
                            <th>Posted Date</th>
                            <th>Status</th>
                            <th>Applications</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${jobs.empty}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-briefcase fs-1 d-block mb-3"></i>
                                No jobs posted yet. <a th:href="@{/recruiter/jobs/new}">Post your first job</a>
                            </td>
                        </tr>
                        <tr th:each="job : ${jobs}">
                            <td class="ps-4">
                                <a th:href="@{/recruiter/jobs/view/{id}(id=${job.id})}" class="text-decoration-none fw-semibold text-dark">
                                    <span th:text="${job.jobTitle}">Senior Java Developer</span>
                                </a>
                                <div class="text-muted small" th:text="${job.location}">Remote</div>
                            </td>
                            <td th:text="${#temporals.format(job.postedAt, 'MMM d, yyyy')}">Oct 24, 2023</td>
                            <td>
                                <span class="status-badge" 
                                      th:classappend="${job.active ? 'status-active' : 'status-closed'}"
                                      th:text="${job.active ? 'Active' : 'Closed'}">
                                    Active
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/recruiter/jobs/{id}/applications(id=${job.id})}" class="btn btn-sm btn-outline-primary">
                                    View Applications
                                </a>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <form th:action="@{/recruiter/jobs/{id}/toggle-status(id=${job.id})}" method="post" style="display: inline;">
                                        <button type="submit" class="btn btn-sm" 
                                                th:classappend="${job.active ? 'btn-outline-warning' : 'btn-outline-success'}"
                                                th:title="${job.active ? 'Deactivate Job' : 'Activate Job'}">
                                            <i th:class="${job.active ? 'bi bi-pause-circle' : 'bi bi-play-circle'}"></i>
                                        </button>
                                    </form>
                                    <a th:href="@{/recruiter/jobs/{id}/edit(id=${job.id})}" class="btn btn-sm btn-outline-secondary" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/recruiter/jobs/{id}/delete(id=${job.id})}" method="post" 
                                          onsubmit="return confirm('Are you sure you want to delete this job? This action cannot be undone.');"
                                          style="display: inline;">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
