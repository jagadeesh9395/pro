<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Skill Tags */
        .skill-tag {
            display: inline-flex;
            align-items: center;
            background-color: #0d6efd;
            color: white;
            border-radius: 50rem;
            padding: 0.35rem 1rem;
            margin: 0.25rem;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        
        .skill-tag:hover {
            background-color: #0b5ed7;
            transform: translateY(-1px);
        }
        
        .btn-close-white {
            filter: invert(1) grayscale(100%) brightness(200%);
            opacity: 0.8;
        }
        
        .btn-close-white:hover {
            opacity: 1;
        }
        
        .btn-close-sm {
            width: 0.5rem;
            height: 0.5rem;
            padding: 0.25rem;
            background-size: 0.5rem;
        }
        
        /* Form Styling */
        .form-section {
            padding: 1rem 1.25rem;
        }
        
        .section-card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .section-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            background-color: #f8f9fa;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
    <title>My Profile - Candidate Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .skill-tag {
            display: inline-block;
            background-color: #e9ecef;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            margin: 0.25rem;
        }
        .section-card {
            margin-bottom: 1.5rem;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .section-header {
            background-color: #f8f9fa;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid #dee2e6;
        }
        .form-section {
            padding: 1.25rem;
        }
        .current-role {
            background-color: #e7f5ff;
        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/candidate/dashboard">TalentPro</a>
        <div class="d-flex">
            <a href="/candidate/dashboard" class="btn btn-outline-light me-2">Dashboard</a>
            <a href="/auth/logout" class="btn btn-outline-light">Logout</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <!-- Alerts -->
    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${param.success[0]}">Profile updated successfully!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${param.error[0]}">Failed to update profile.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form id="profileForm" th:action="@{/candidate/profile/update}" method="post" th:object="${candidate}" enctype="multipart/form-data">
        <!-- Basic Information -->
        <div class="section-card">
            <div class="section-header">
                <h5 class="mb-0">Basic Information</h5>
            </div>
            <div class="form-section">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" th:field="*{fullName}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}">
                    </div>
                    <div class="col-12">
                        <label for="currentAddress" class="form-label">Current Address</label>
                        <textarea class="form-control" id="currentAddress" th:field="*{currentAddress}" rows="2"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Work Experience -->
        <div class="section-card">
            <div class="section-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Work Experience</h5>
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addWorkExperience()">
                    <i class="bi bi-plus"></i> Add Experience
                </button>
            </div>
            <div class="form-section" id="workExperienceContainer">
                <div class="work-experience-item card mb-3" th:each="exp, iterStat : *{workExperiences}" th:if="${exp != null}">
                    <div class="card-body" th:classappend="${exp.current} ? 'current-role' : ''">
                        <div class="d-flex justify-content-between">
                            <h6 class="card-title" th:text="${exp.jobTitle}">Job Title</h6>
                            <button type="button" class="btn-close" onclick="removeItem(this, 'workExperience')"></button>
                        </div>
                        <p class="card-subtitle mb-2 text-muted" th:text="${exp.employer}">Company</p>
                        <div class="row g-3">
                            <input type="hidden" th:name="workExperiences[__${iterStat.index}__].id" th:value="${exp.id}">
                            <div class="col-md-6">
                                <label class="form-label small">Job Title *</label>
                                <input type="text" class="form-control form-control-sm"
                                       th:field="*{workExperiences[__${iterStat.index}__].jobTitle}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Employer *</label>
                                <input type="text" class="form-control form-control-sm"
                                       th:field="*{workExperiences[__${iterStat.index}__].employer}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Start Date *</label>
                                <input type="date" class="form-control form-control-sm"
                                       th:field="*{workExperiences[__${iterStat.index}__].startDate}" required>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check mt-4 pt-2">
                                    <input type="checkbox" class="form-check-input"
                                           th:field="*{workExperiences[__${iterStat.index}__].current}"
                                           onchange="toggleEndDate(this, 'workExperiences', ${iterStat.index})">
                                    <label class="form-check-label small">I currently work here</label>
                                </div>
                                <div class="end-date-group" th:classappend="${exp.current} ? 'd-none' : ''">
                                    <label class="form-label small">End Date</label>
                                    <input type="date" class="form-control form-control-sm"
                                           th:field="*{workExperiences[__${iterStat.index}__].endDate}">
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Description</label>
                                <textarea class="form-control form-control-sm" rows="2"
                                          th:field="*{workExperiences[__${iterStat.index}__].description}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Education -->
        <div class="section-card">
            <div class="section-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Education</h5>
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addEducation()">
                    <i class="bi bi-plus"></i> Add Education
                </button>
            </div>
            <div class="form-section" id="educationContainer">
                <div class="education-item card mb-3" th:each="edu, iterStat : *{educations}" th:if="${edu != null}">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h6 class="card-title" th:text="${edu.degree} + ' at ' + ${edu.institution}">Degree</h6>
                            <button type="button" class="btn-close" onclick="removeItem(this, 'education')"></button>
                        </div>
                        <div class="row g-3">
                            <input type="hidden" th:name="educations[__${iterStat.index}__].id" th:value="${edu.id}">
                            <div class="col-md-6">
                                <label class="form-label small">Degree *</label>
                                <input type="text" class="form-control form-control-sm"
                                       th:field="*{educations[__${iterStat.index}__].degree}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Institution *</label>
                                <input type="text" class="form-control form-control-sm"
                                       th:field="*{educations[__${iterStat.index}__].institution}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Start Date *</label>
                                <input type="date" class="form-control form-control-sm"
                                       th:field="*{educations[__${iterStat.index}__].startDate}" required>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check mt-4 pt-2">
                                    <input type="checkbox" class="form-check-input"
                                           th:field="*{educations[__${iterStat.index}__].current}"
                                           onchange="toggleEndDate(this, 'educations', ${iterStat.index})">
                                    <label class="form-check-label small">Currently Enrolled</label>
                                </div>
                                <div class="end-date-group" th:classappend="${edu.current} ? 'd-none' : ''">
                                    <label class="form-label small">End Date</label>
                                    <input type="date" class="form-control form-control-sm"
                                           th:field="*{educations[__${iterStat.index}__].endDate}">
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Description</label>
                                <textarea class="form-control form-control-sm" rows="2"
                                          th:field="*{educations[__${iterStat.index}__].description}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Skills -->
        <div class="section-card">
            <div class="section-header">
                <h5 class="mb-0">Skills</h5>
            </div>
            <div class="form-section">
                <div class="mb-3">
                    <label for="skillInput" class="form-label">Add Skills</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="skillInput" placeholder="Type a skill and press Enter" aria-label="Add a skill">
                        <button class="btn btn-outline-secondary" type="button" id="addSkillBtn">
                            <i class="bi bi-plus"></i> Add
                        </button>
                    </div>
                    <div class="mt-2 d-flex flex-wrap gap-2" id="skillsContainer">
                        <template th:if="${candidate.skills != null}">
                            <span class="skill-tag" th:each="skill, stat : ${candidate.skills}">
                                <input type="hidden" th:name="skills" th:value="${skill}">
                                <span th:text="${skill}"></span>
                                <button type="button" class="btn-close btn-close-white btn-sm ms-1" 
                                        aria-label="Remove skill" onclick="removeSkill(this)"></button>
                            </span>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- References -->
        <div class="section-card">
            <div class="section-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">References</h5>
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addReference()">
                    <i class="bi bi-plus"></i> Add Reference
                </button>
            </div>
            <div class="form-section" id="referencesContainer">
                <div class="reference-item card mb-3" th:each="ref, iterStat : *{references}" th:if="${ref != null}">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h6 class="card-title" th:text="${ref.name}">Reference Name</h6>
                            <button type="button" class="btn-close" onclick="removeItem(this, 'reference')"></button>
                        </div>
                        <div class="row g-3">
                            <input type="hidden" th:name="references[__${iterStat.index}__].id" th:value="${ref.id}">
                            <div class="col-md-6">
                                <label class="form-label small">Name *</label>
                                <input type="text" class="form-control form-control-sm"
                                       th:field="*{references[__${iterStat.index}__].name}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Relationship *</label>
                                <input type="text" class="form-control form-control-sm"
                                       th:field="*{references[__${iterStat.index}__].relationship}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Email *</label>
                                <input type="email" class="form-control form-control-sm"
                                       th:field="*{references[__${iterStat.index}__].email}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Phone *</label>
                                <input type="tel" class="form-control form-control-sm"
                                       th:field="*{references[__${iterStat.index}__].phone}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Company</label>
                                <input type="text" class="form-control form-control-sm"
                                       th:field="*{references[__${iterStat.index}__].company}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Position</label>
                                <input type="text" class="form-control form-control-sm"
                                       th:field="*{references[__${iterStat.index}__].position}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Resume & Cover Letter -->
        <div class="section-card">
            <div class="section-header">
                <h5 class="mb-0">Resume & Cover Letter</h5>
            </div>
            <div class="form-section">
                <div class="mb-3">
                    <label for="resumeFile" class="form-label">Upload Resume</label>
                    <div th:if="${candidate.resumeUrl}" class="mb-2">
                        <a th:href="${candidate.resumeUrl}" target="_blank" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-download"></i> View Current Resume
                        </a>
                    </div>
                    <input type="file" class="form-control" id="resumeFile" name="resumeFile" accept=".pdf,.doc,.docx">
                    <div class="form-text">Accepted formats: PDF, DOC, DOCX (Max 5MB)</div>
                </div>
                <div class="mb-3">
                    <label for="coverLetter" class="form-label">Cover Letter</label>
                    <textarea class="form-control" id="coverLetter" th:field="*{coverLetter}" rows="6"></textarea>
                </div>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
            <a href="/candidate/dashboard" class="btn btn-outline-secondary me-md-2">Cancel</a>
            <button type="submit" class="btn btn-primary" id="submitBtn">Save Profile</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize any date pickers or other UI components
        initializeDatePickers();

            // Initialize skill input handling
        const skillInput = document.getElementById('skillInput');
        if (skillInput) {
            // Add skill on Enter key
            skillInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addSkill();
                }
            });
            
            // Add click handler for the add skill button
            const addSkillBtn = document.getElementById('addSkillBtn');
            if (addSkillBtn) {
                addSkillBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    addSkill();
                });
            }
        }
    });

    // Work Experience
    function addWorkExperience() {
        const container = document.getElementById('workExperienceContainer');
        const index = document.querySelectorAll('.work-experience-item').length;

        const html = `
            <div class="work-experience-item card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h6>Experience #${index + 1}</h6>
                        <button type="button" class="btn-close" onclick="removeItem(this, 'workExperience')"></button>
                    </div>
                    <div class="row g-3">
                        <input type="hidden" name="workExperiences[${index}].id" value="">
                        <div class="col-md-6">
                            <label class="form-label small">Job Title *</label>
                            <input type="text" class="form-control form-control-sm"
                                   name="workExperiences[${index}].jobTitle" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Employer *</label>
                            <input type="text" class="form-control form-control-sm"
                                   name="workExperiences[${index}].employer" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Start Date *</label>
                            <input type="date" class="form-control form-control-sm"
                                   name="workExperiences[${index}].startDate" required>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check mt-4 pt-2">
                                <input type="checkbox" class="form-check-input"
                                       name="workExperiences[${index}].current" value="true"
                                       onchange="toggleEndDate(this, 'workExperiences', ${index})">
                                <label class="form-check-label small">I currently work here</label>
                            </div>
                            <div class="end-date-group">
                                <label class="form-label small">End Date</label>
                                <input type="date" class="form-control form-control-sm"
                                       name="workExperiences[${index}].endDate">
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label small">Description</label>
                            <textarea class="form-control form-control-sm" rows="2"
                                      name="workExperiences[${index}].description"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        `;

        container.insertAdjacentHTML('beforeend', html);
    }

    // Education
    function addEducation() {
        const container = document.getElementById('educationContainer');
        const index = document.querySelectorAll('.education-item').length;

        const html = `
            <div class="education-item card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h6>Education #${index + 1}</h6>
                        <button type="button" class="btn-close" onclick="removeItem(this, 'education')"></button>
                    </div>
                    <div class="row g-3">
                        <input type="hidden" name="educations[${index}].id" value="">
                        <div class="col-md-6">
                            <label class="form-label small">Degree *</label>
                            <input type="text" class="form-control form-control-sm"
                                   name="educations[${index}].degree" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Institution *</label>
                            <input type="text" class="form-control form-control-sm"
                                   name="educations[${index}].institution" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Start Date *</label>
                            <input type="date" class="form-control form-control-sm"
                                   name="educations[${index}].startDate" required>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check mt-4 pt-2">
                                <input type="checkbox" class="form-check-input"
                                       name="educations[${index}].current" value="true"
                                       onchange="toggleEndDate(this, 'educations', ${index})">
                                <label class="form-check-label small">Currently Enrolled</label>
                            </div>
                            <div class="end-date-group">
                                <label class="form-label small">End Date</label>
                                <input type="date" class="form-control form-control-sm"
                                       name="educations[${index}].endDate">
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label small">Description</label>
                            <textarea class="form-control form-control-sm" rows="2"
                                      name="educations[${index}].description"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        `;

        container.insertAdjacentHTML('beforeend', html);
    }

    // References
    function addReference() {
        const container = document.getElementById('referencesContainer');
        const index = document.querySelectorAll('.reference-item').length;

        const html = `
            <div class="reference-item card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h6>Reference #${index + 1}</h6>
                        <button type="button" class="btn-close" onclick="removeItem(this, 'reference')"></button>
                    </div>
                    <div class="row g-3">
                        <input type="hidden" name="references[${index}].id" value="">
                        <div class="col-md-6">
                            <label class="form-label small">Name *</label>
                            <input type="text" class="form-control form-control-sm"
                                   name="references[${index}].name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Relationship *</label>
                            <input type="text" class="form-control form-control-sm"
                                   name="references[${index}].relationship" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Email *</label>
                            <input type="email" class="form-control form-control-sm"
                                   name="references[${index}].email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Phone *</label>
                            <input type="tel" class="form-control form-control-sm"
                                   name="references[${index}].phone" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Company</label>
                            <input type="text" class="form-control form-control-sm"
                                   name="references[${index}].company">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small">Position</label>
                            <input type="text" class="form-control form-control-sm"
                                   name="references[${index}].position">
                        </div>
                    </div>
                </div>
            </div>
        `;

        container.insertAdjacentHTML('beforeend', html);
    }

    // Skills
    function addSkill() {
        const skillInput = document.getElementById('skillInput');
        if (!skillInput) return;
        
        const skillsContainer = document.getElementById('skillsContainer');
        if (!skillsContainer) return;
        
        const skill = skillInput.value.trim();
        if (!skill) {
            // Show error or focus the input
            skillInput.focus();
            return;
        }

        // Check if skill already exists (case-insensitive)
        const existingSkills = Array.from(document.querySelectorAll('#skillsContainer .skill-tag input[type="hidden"]'))
            .map(input => input.value.trim().toLowerCase());

        if (existingSkills.includes(skill.toLowerCase())) {
            // Show error message
            const errorDiv = document.createElement('div');
            errorDiv.className = 'text-danger small mt-1';
            errorDiv.textContent = 'This skill has already been added.';
            
            // Remove any existing error messages
            const existingError = skillInput.parentElement.querySelector('.text-danger');
            if (existingError) {
                existingError.remove();
            }
            
            skillInput.parentElement.appendChild(errorDiv);
            skillInput.focus();
            
            // Remove error after 3 seconds
            setTimeout(() => {
                errorDiv.remove();
            }, 3000);
            
            return;
        }

        // Create the skill tag element
        const skillTag = document.createElement('span');
        skillTag.className = 'skill-tag d-inline-flex align-items-center bg-primary text-white rounded-pill px-3 py-1 me-2 mb-2';
        
        // Add hidden input for form submission
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = 'skills';
        hiddenInput.value = skill;
        
        // Add skill text
        const skillText = document.createElement('span');
        skillText.className = 'me-1';
        skillText.textContent = skill;
        
        // Add remove button
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'btn-close btn-close-white btn-close-sm ms-1';
        removeBtn.setAttribute('aria-label', 'Remove skill');
        removeBtn.onclick = function() { removeSkill(this); };
        
        // Assemble the skill tag
        skillTag.appendChild(hiddenInput);
        skillTag.appendChild(skillText);
        skillTag.appendChild(removeBtn);
        
        // Add to container
        skillsContainer.appendChild(skillTag);
        
        // Clear input and focus it for next entry
        skillInput.value = '';
        skillInput.focus();
    }

    // Helper Functions
    function removeItem(button, type) {
        if (confirm('Are you sure you want to remove this item?')) {
{{ ... }}
            if (item) {
                item.remove();
                reindexFormItems(type);
            }
        }
    }

    function removeSkill(button) {
        const skillTag = button.closest('.skill-tag');
        if (skillTag) {
            skillTag.remove();
        }
    }

    function toggleEndDate(checkbox, type, index) {
        const row = checkbox.closest('.row');
        if (!row) return;
        
        const endDateGroup = row.querySelector('.end-date-group');
        if (!endDateGroup) return;
        
        if (checkbox.checked) {
            endDateGroup.classList.add('d-none');
            // Clear the end date when marking as current
            const endDateInput = endDateGroup.querySelector('input[type="date"]');
            if (endDateInput) endDateInput.value = '';
        } else {
            endDateGroup.classList.remove('d-none');
        }
    }

    function reindexFormItems(type) {
        const container = document.getElementById(`${type}Container`);
        if (!container) return;
        
        const items = container.querySelectorAll(`.${type}-item`);
        if (!items.length) return;

        items.forEach((item, index) => {
            // Update all input names with new index
            const inputs = item.querySelectorAll('input, textarea, select');
            inputs.forEach(input => {
                const name = input.name;
                if (name) {
                    // Handle both workExperiences[0].field and educations[0].field formats
                    input.name = name.replace(new RegExp(`${type}\\[\\d+\\.`), `${type}[${index}].`)
                                    .replace(new RegExp(`${type}\\[\\d+\\]`), `${type}[${index}]`);
                }
            });
            
            // Update the heading number
            const heading = item.querySelector('h6');
            if (heading) {
                heading.textContent = `${type === 'workExperience' ? 'Experience' : type.charAt(0).toUpperCase() + type.slice(1)} #${index + 1}`;
            }
        });
    }

    function initializeDatePickers() {
        // Initialize any date picker plugins here
        // Example using native HTML5 date input:
        document.querySelectorAll('input[type="date"]').forEach(input => {
            if (!input.value && input.type === 'date') {
                const today = new Date().toISOString().split('T')[0];
                input.value = today;
            }
        });
    }

    // Form submission with AJAX
    document.getElementById('profileForm')?.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const form = this;
        const formData = new FormData(form);
        const submitBtn = document.getElementById('submitBtn');
        const originalBtnText = submitBtn.innerHTML;
        
        try {
            // Manually collect skills
            const skills = [];
            document.querySelectorAll('.skill-tag input[type="hidden"]').forEach(input => {
                if (input.value && input.value.trim() !== '') {
                    skills.push(input.value.trim());
                }
            });
            
            // Add each skill as a separate form field
            skills.forEach((skill, index) => {
                formData.append('skills', skill);
            });
            
            // Log form data for debugging
            console.log('Form data:');
            for (let [key, value] of formData.entries()) {
                console.log(key, value);
            }
            
            // Basic validation
            const requiredFields = form.querySelectorAll('[required]');
            let isValid = true;
            
            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.classList.add('is-invalid');
                    isValid = false;
                } else {
                    field.classList.remove('is-invalid');
                }
            });
            
            if (!isValid) {
                throw new Error('Please fill in all required fields');
            }
            
            // File validation
            const resumeFile = document.getElementById('resumeFile');
            if (resumeFile && resumeFile.files.length > 0) {
                const file = resumeFile.files[0];
                const validTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];

                if (!validTypes.includes(file.type)) {
                    throw new Error('Please upload a valid document (PDF, DOC, or DOCX)');
                }

                if (file.size > 5 * 1024 * 1024) { // 5MB
                    throw new Error('File size should not exceed 5MB');
                }
            }
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Saving...';
            
            // Make the API request
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            
            const result = await response.json();
            console.log('Server response:', result);
            
            if (response.ok) {
                // Show success message and reload
                window.location.href = '/candidate/profile?success=' + encodeURIComponent('Profile updated successfully!');
            } else {
                const errorMessage = result.message || 
                    (result.error || 'Failed to update profile. Please try again.');
                throw new Error(errorMessage);
            }
            
        } catch (error) {
            console.error('Error:', error);
            alert('Error: ' + (error.message || 'Failed to update profile. Please try again.'));
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
        }
    });
    });
</script>
