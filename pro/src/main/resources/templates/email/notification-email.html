<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification - TalentTrove</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header {
            background-color: #4a6fa5;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .content {
            padding: 30px;
        }
        .content h2 {
            color: #4a6fa5;
            margin-top: 0;
        }
        .content p {
            margin-bottom: 15px;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            border-top: 1px solid #e9ecef;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4a6fa5;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #3b5a84;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TalentTrove</h1>
        </div>
        <div class="content">
            <h2 th:text="${title}">Notification Title</h2>
            <div th:utext="${message}">
                Notification message content goes here.
            </div>
            <p th:if="${actionUrl != null}">
                <a th:href="${actionUrl}" class="btn">View Details</a>
            </p>
        </div>
        <div class="footer">
            <p>&copy; 2023 TalentTrove. All rights reserved.</p>
            <p>This is an automated message, please do not reply to this email.</p>
        </div>
    </div>
</body>
</html>
