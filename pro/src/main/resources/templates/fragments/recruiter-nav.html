<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- Navigation Fragment for Recruiter -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary-color);">
        <div class="container">
            <a class="navbar-brand" href="/">TalentTrove</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/recruiter/dashboard}"
                           th:classappend="${#strings.startsWith(currentPath, '/recruiter/dashboard') ? 'active' : ''}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/recruiter/jobs}"
                           th:classappend="${#strings.startsWith(currentPath, '/recruiter/jobs') ? 'active' : ''}">
                            <i class="bi bi-briefcase me-1"></i> Jobs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/recruiter/candidates}"
                           th:classappend="${#strings.startsWith(currentPath, '/recruiter/candidates') ? 'active' : ''}">
                            <i class="bi bi-people me-1"></i> Candidates
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/recruiter/interviews}"
                           th:classappend="${#strings.startsWith(currentPath, '/recruiter/interviews') ? 'active' : ''}">
                            <i class="bi bi-calendar-check me-1"></i> Interviews
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                                  th:if="${upcomingInterviewCount != null && upcomingInterviewCount > 0}" 
                                  th:text="${upcomingInterviewCount}">
                            </span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/recruiter/analytics}"
                           th:classappend="${#strings.startsWith(currentPath, '/recruiter/analytics') ? 'active' : ''}">
                            <i class="bi bi-graph-up me-1"></i> Analytics
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" 
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-2"></i>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <a class="dropdown-item" th:href="@{/recruiter/profile}">
                                    <i class="bi bi-person me-2"></i> Profile
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/recruiter/settings}">
                                    <i class="bi bi-gear me-2"></i> Settings
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline w-100">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
